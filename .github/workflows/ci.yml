name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and import base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -c "import pseudopath"

      - name: Install optional test and Transformer dependencies
        run: python -m pip install ".[test,transformer]" "ruff>=0.9,<1" "build>=1,<2" "twine>=6,<7"

      - name: Lint and format
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Install and import built wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/pseudopath-*.whl
          cd /tmp
          python -c "import pseudopath; print(pseudopath.__file__)"

      - name: Save validated distributions for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
