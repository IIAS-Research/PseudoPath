name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish, such as v1.0.0
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    outputs:
      created: ${{ steps.validate.outputs.created }}
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
    steps:
      - name: Check that CI validated the current main commit
        id: head
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const {data: branch} = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main',
            });
            const current = branch.commit.sha === run.head_sha;
            core.setOutput('current', String(current));
            if (!current) {
              core.notice('Main has advanced since this CI run. Release preparation skipped.');
            }

      - name: Prepare a release PR or create its tag and GitHub release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify the release tag and find its successful CI run
        id: validate
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            let releaseSha = process.env.RELEASE_SHA;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error('Expected a stable release tag such as v1.0.0.');
            }
            if (!manual && (!version || tag !== `v${version}`)) {
              throw new Error('Release tag and version do not agree.');
            }
            if (manual) {
              const {data: release} = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag,
              });
              if (release.draft || release.prerelease || release.tag_name !== tag) {
                throw new Error('Manual publishing requires an existing stable, published GitHub release.');
              }
            }
            const {data: reference} = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            let target = reference.object;
            while (target.type === 'tag') {
              const {data: annotation} = await github.rest.git.getTag({
                ...context.repo,
                tag_sha: target.sha,
              });
              target = annotation.object;
            }
            if (target.type !== 'commit' || (!manual && target.sha !== releaseSha)) {
              throw new Error('The release tag does not point to the release commit.');
            }
            releaseSha = target.sha;
            let run = context.payload.workflow_run;
            if (!run || run.head_sha !== releaseSha) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                event: 'push',
                head_sha: releaseSha,
                status: 'success',
                per_page: 100,
              });
              run = data.workflow_runs.find(candidate =>
                candidate.head_sha === releaseSha &&
                candidate.conclusion === 'success' &&
                candidate.event === 'push' &&
                candidate.head_branch === 'main' &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`
              );
            }
            if (!run) {
              throw new Error('No successful push CI run on main exists for this exact release commit.');
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', releaseSha);
            core.setOutput('ci_run_id', String(run.id));
            core.setOutput('created', 'true');

  publish:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pseudopath/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download the distributions from the successful CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify distribution names and versions before publishing
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Expected a stable release tag such as v1.0.0.")
          version = tag[1:]
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sources = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sources) != 1:
              raise SystemExit("Expected exactly one wheel and one source distribution.")
          if set(dist.iterdir()) != set(wheels + sources):
              raise SystemExit("Unexpected files in the distribution artifact.")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = [name for name in archive.namelist()
                          if name.endswith(".dist-info/METADATA")]
              if len(metadata) != 1:
                  raise SystemExit("Expected a unique wheel METADATA file.")
              wheel_metadata = archive.read(metadata[0])
          with tarfile.open(sources[0], "r:gz") as archive:
              metadata = [member for member in archive.getmembers()
                          if member.isfile() and member.name.count("/") == 1
                          and member.name.endswith("/PKG-INFO")]
              if len(metadata) != 1:
                  raise SystemExit("Expected a unique root source PKG-INFO file.")
              with archive.extractfile(metadata[0]) as stream:
                  source_metadata = stream.read()

          for data in (wheel_metadata, source_metadata):
              metadata = BytesParser().parsebytes(data)
              name = re.sub(r"[-_.]+", "-", metadata.get("Name", "")).lower()
              if name != "pseudopath" or metadata.get("Version") != version:
                  raise SystemExit("Distribution metadata does not match PseudoPath and the release tag.")
          print(f"Validated PseudoPath {version}: wheel and source distribution.")
          PY

      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
