[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudopath"
version = "0.1.1"
description = "Residual line routing for clinical named-entity recognition"
readme = "README.md"
license = "GPL-3.0-only AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "setuptools>=77,<81", # EDS-NLP 0.17 imports pkg_resources at runtime.
  "confit>=0.7.3,<1",
  "edsnlp>=0.17,<0.18",
  "spacy>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/IIAS-Research/PseudoPath"
Documentation = "https://iias-research.github.io/PseudoPath/"
Issues = "https://github.com/IIAS-Research/PseudoPath/issues"

[project.optional-dependencies]
transformer = ["edsnlp[ml]>=0.17,<0.18", "sentencepiece>=0.1.96"]
test = ["pytest>=8,<10"]
docs = ["sphinx>=8,<9", "furo>=2024.8.6,<2027", "myst-parser>=4,<5", "sphinx-autobuild>=2024.10.3,<2027"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
